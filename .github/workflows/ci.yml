name: CI

on:
  push:
    branches: [main, upcoming]
  pull_request:
    branches: [main, upcoming]

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: go.work.sum

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ${{ matrix.module }}/.testcoverage.yml
          profile: ${{ matrix.module }}/coverage.out
          source-dir: ${{ matrix.module }}

      - name: Per-package coverage gate (pipeline + services)
        if: matrix.module == 'server'
        # Floor is intentionally set to the current per-package coverage so the
        # gate catches regressions immediately. Ratchet upward toward 70 as
        # tests are added. Override per-run via repo/Actions env if needed.
        env:
          COVERAGE_THRESHOLD: '20'
        run: |
          cd server
          go tool cover -func=coverage.out > coverage.func.txt
          cd ..
          bash scripts/coverage-gate.sh server/coverage.func.txt 'internal/pipeline' 'internal/services'

  test-plugins:
    name: Test (plugins/${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [github-oauth, office365-oauth]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/${{ matrix.plugin }}/go.mod
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum

      - name: Test
        working-directory: plugins/${{ matrix.plugin }}
        run: GOWORK=off go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: plugins/${{ matrix.plugin }}/.testcoverage.yml
          profile: plugins/${{ matrix.plugin }}/coverage.out
          source-dir: plugins/${{ matrix.plugin }}

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Lint
        working-directory: ${{ matrix.module }}
        run: golangci-lint run ./...

  lint-plugins:
    name: Lint (plugins/${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [github-oauth, office365-oauth]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/${{ matrix.plugin }}/go.mod
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Lint
        working-directory: plugins/${{ matrix.plugin }}
        run: GOWORK=off golangci-lint run ./...

  security:
    name: Security (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - server
          - sdk
          - plugins/github-oauth
          - plugins/office365-oauth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: GOWORK=off govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, test-plugins, lint-plugins]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build server binary
        working-directory: server
        run: go build -o /dev/null ./cmd/serve/...
      - name: Build plugin binaries
        run: |
          for plugin in plugins/github-oauth plugins/office365-oauth; do
            echo "=== building $plugin ===" && (cd "$plugin" && GOWORK=off go build -o /dev/null .)
          done

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        # Vite emits SPA assets to dist/assets/ before the PWA service-worker
        # post-build step runs. A SW build failure is unrelated to bundle size,
        # so we tolerate non-zero exit here and gate the next step on whether
        # the SPA assets actually exist.
        run: pnpm build || true
      - name: Verify build artifacts present
        run: test -d dist/assets || { echo "dist/assets missing — vite build did not emit SPA assets"; exit 1; }
      - name: Check bundle-size budget
        # Thresholds can be tightened/loosened via env without editing the script.
        env:
          JS_MAX_GZIP_KB: '200'
          CSS_MAX_GZIP_KB: '30'
        run: bash scripts/check-bundle-size.sh dist/assets

  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
