name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, sdk]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: go.work.sum

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ${{ matrix.module }}/.testcoverage.yml
          profile: ${{ matrix.module }}/coverage.out
          source-dir: ${{ matrix.module }}

      - name: Per-package coverage gate (pipeline + services)
        if: matrix.module == 'server'
        # Floor is intentionally set to the current per-package coverage so the
        # gate catches regressions immediately. Ratchet upward toward 70 as
        # tests are added. Override per-run via repo/Actions env if needed.
        env:
          COVERAGE_THRESHOLD: '20'
        run: |
          cd server
          go tool cover -func=coverage.out > coverage.func.txt
          cd ..
          bash scripts/coverage-gate.sh server/coverage.func.txt 'internal/pipeline' 'internal/services'

  test-plugins:
    name: Test (plugins/${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [github-oauth, office365-oauth, voice-whisper, voice-webspeech, anthropic-spawner]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: plugins/${{ matrix.plugin }}/go.mod
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum

      - name: Test
        working-directory: plugins/${{ matrix.plugin }}
        run: GOWORK=off go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: plugins/${{ matrix.plugin }}/.testcoverage.yml
          profile: plugins/${{ matrix.plugin }}/coverage.out
          source-dir: plugins/${{ matrix.plugin }}

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, sdk]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: go.work.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Verify golangci config
        working-directory: ${{ matrix.module }}
        run: golangci-lint config verify
      - name: Lint
        working-directory: ${{ matrix.module }}
        run: golangci-lint run ./...

  lint-plugins:
    name: Lint (plugins/${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [github-oauth, office365-oauth, voice-whisper, voice-webspeech, anthropic-spawner]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: plugins/${{ matrix.plugin }}/go.mod
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Verify golangci config
        working-directory: plugins/${{ matrix.plugin }}
        run: GOWORK=off golangci-lint config verify
      - name: Lint
        working-directory: plugins/${{ matrix.plugin }}
        run: GOWORK=off golangci-lint run ./...

  security:
    name: Security (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - server
          - sdk
          - plugins/github-oauth
          - plugins/office365-oauth
          - plugins/voice-whisper
          - plugins/voice-webspeech
          - plugins/anthropic-spawner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # sdk has no go.sum (workspace member, no external deps); go.work.sum
          # guarantees at least one resolvable path so setup-go caching never errors.
          cache-dependency-path: |
            go.work.sum
            ${{ matrix.module }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: GOWORK=off govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, test-plugins, lint-plugins]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build server binary
        working-directory: server
        run: go build -o /dev/null ./cmd/serve/...
      - name: Build plugin binaries
        run: |
          for plugin in plugins/github-oauth plugins/office365-oauth plugins/voice-whisper plugins/voice-webspeech plugins/anthropic-spawner; do
            echo "=== building $plugin ===" && (cd "$plugin" && GOWORK=off go build -o /dev/null .)
          done

  frontend:
    name: Frontend (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.check }}
        run: pnpm ${{ matrix.check }}

  frontend-build:
    name: Frontend Build & Bundle Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build
      - name: Verify build artifacts present
        run: test -d server/frontend/dist/assets || { echo "server/frontend/dist/assets missing — vite build did not emit SPA assets"; exit 1; }
      - name: Check bundle-size budget
        # Thresholds can be tightened/loosened via env without editing the script.
        # Per-chunk JS budgets: vendor (vue) 200 KB, charts (d3) 400 KB, index 100 KB.
        env:
          JS_MAX_GZIP_KB: '100'
          JS_VENDOR_MAX_GZIP_KB: '200'
          JS_CHARTS_MAX_GZIP_KB: '400'
          CSS_MAX_GZIP_KB: '30'
        run: bash scripts/check-bundle-size.sh server/frontend/dist/assets
  licenses:
    name: License Attribution Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: go.work.sum
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Regenerate THIRD_PARTY_LICENSES.md
        run: ./scripts/gen-licenses.sh
      - name: Verify it is up to date
        run: |
          git diff --exit-code -- THIRD_PARTY_LICENSES.md || {
            echo "THIRD_PARTY_LICENSES.md is stale — run 'task licenses' and commit the result."
            exit 1
          }

  desktop-build:
    name: Desktop Shell Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: go.work.sum
      - name: Build desktop shell (real wails link path)
        working-directory: desktop
        # -tags production selects the real wails app; the extldflags links
        # UniformTypeIdentifiers, which wails needs on the macOS 15 SDK but a
        # plain build omits. This is the same incantation as `task desktop:build`.
        run: CGO_ENABLED=1 go build -tags production -ldflags "-extldflags '-framework UniformTypeIdentifiers'" -o /dev/null .

  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
