version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
  exclusions:
    rules:
      - path: ".*_test\\.go$"
        linters: [errcheck]
      - linters: [revive]
        text: "stutters"
