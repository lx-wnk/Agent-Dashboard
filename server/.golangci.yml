version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (*compress/gzip.Writer).Close
        - (*database/sql.Rows).Close
        - (github.com/lx-wnk/agent-dashboard/server/internal/db/ent.Client).Close
  exclusions:
    rules:
      - path: ".*_test\\.go$"
        linters: [errcheck]
      - path: "internal/db/ent/"
        linters: [staticcheck, govet, revive, errcheck]
      - linters: [revive]
        text: "stutters"
