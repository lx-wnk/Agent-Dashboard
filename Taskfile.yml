# Taskfile.yml
version: '3'

tasks:
  default:
    cmds: [task --list]

  dev:
    desc: Start Go backend + Vite frontend (requires air)
    deps: [dev:go, dev:frontend]

  dev:go:
    desc: Start Go backend with air hot-reload on :13120
    cmd: $(go env GOPATH)/bin/air -c .air.toml

  dev:frontend:
    desc: Start Vite dev server with HMR on :5173
    cmd: pnpm dev

  setup:
    desc: Install the dev toolchain (air, golangci-lint, tygo, govulncheck) + frontend deps
    cmds:
      - go install github.com/air-verse/air@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - go install github.com/gzuidhof/tygo@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - pnpm install
      - echo "✓ setup complete — run 'task doctor' to verify, then 'task dev'"

  doctor:
    desc: Check that all required tools are installed and on PATH
    cmd: ./scripts/doctor.sh

  build:frontend:
    desc: Build the Vue SPA into the Go embed dir (server/frontend/dist)
    cmd: pnpm build

  build:
    desc: Build server binary (embeds whatever is currently in server/frontend/dist)
    dir: server
    cmd: go build -ldflags "-X main.version={{.VERSION}}" -o ../bin/agent-dashboard ./cmd/serve/...
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev

  build:all:
    desc: Build frontend then embed it into a self-contained server binary
    cmds:
      - task: build:frontend
      - task: build

  build:cli:
    desc: Build dashboard CLI binary
    dir: server
    cmd: go build -o ../bin/dashboard ./cmd/cli/...

  test:
    desc: Run all tests (all modules)
    cmds:
      - cd sdk && go test -race ./...
      - cd server && go test -race ./...

  test:cover:
    desc: Run tests with coverage report (server module)
    dir: server
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  test:watch:
    desc: Watch mode tests (server module)
    dir: server
    cmd: go test -race ./... -count=1

  lint:
    desc: Run golangci-lint (all modules)
    cmds:
      - cd sdk && golangci-lint run ./...
      - cd server && golangci-lint run ./...

  generate:
    desc: Run go generate (ent schemas) and tygo TS codegen
    cmds:
      - $(go env GOPATH)/bin/tygo generate --config tygo.yaml
      - cd server && go generate ./...

  vuln:
    desc: Run govulncheck
    cmds:
      - cd sdk && govulncheck ./...
      - cd server && govulncheck ./...

  licenses:
    desc: Generate THIRD_PARTY_LICENSES.md from Go and frontend dependencies
    cmd: ./scripts/gen-licenses.sh

  audit:frontend:
    desc: Run pnpm audit on frontend dependencies (fails on high or critical vulnerabilities)
    cmd: pnpm audit --audit-level=high

  # wire task removed — DI is hand-written in server/cmd/serve/di.go (no google/wire codegen)

  fmt:
    desc: Format all Go code
    cmd: gofmt -w sdk/ server/
