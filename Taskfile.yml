# Taskfile.yml
version: '3'

tasks:
  default:
    cmds: [task --list]

  dev:
    desc: Start Go backend + Vite frontend (requires air)
    deps: [dev:go, dev:frontend]

  dev:go:
    desc: Start Go backend with air hot-reload on :13120
    cmd: $(go env GOPATH)/bin/air -c .air.toml

  dev:frontend:
    desc: Start Vite dev server with HMR on :5173
    cmd: pnpm dev

  dev:desktop:
    desc: Run the macOS desktop shell with wails hot-reload (rebuilds the Go shell on change; requires the wails CLI + Xcode CLT)
    platforms: [darwin]
    cmds:
      # Embed the current SPA first — the webview redirects to the in-process
      # server on 127.0.0.1:13120, not wails' asset server, so the SPA is served
      # from the Go embed. This task hot-reloads the Go shell; for frontend HMR
      # use `task dev` (browser on :5173).
      - task: build:frontend
      # No -tags production here: `wails dev` always adds its own `dev` tag, and
      # dev+production together redeclare App.Run/CreateApp in wails' app package.
      # The two release paths (build:desktop, desktop:dist) pass the tag explicitly.
      - cd desktop && $(go env GOPATH)/bin/wails dev -ldflags "-extldflags '-framework UniformTypeIdentifiers'"

  setup:
    desc: Install the dev toolchain (air, golangci-lint, tygo, govulncheck) + frontend deps
    cmds:
      - go install github.com/air-verse/air@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - go install github.com/gzuidhof/tygo@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - pnpm install
      - echo "✓ setup complete — run 'task doctor' to verify, then 'task dev'"

  doctor:
    desc: Check that all required tools are installed and on PATH
    cmd: ./scripts/doctor.sh

  build:frontend:
    desc: Build the Vue SPA into the Go embed dir (server/frontend/dist)
    # `once`: several tasks depend on this; without it go-task's default
    # (run: always) rebuilds the SPA for each of them in the same invocation.
    run: once
    cmd: pnpm build

  build:
    desc: Build server binary (embeds whatever is currently in server/frontend/dist)
    dir: server
    cmd: go build -ldflags "-X main.version={{.VERSION}}" -o ../bin/agent-dashboard ./cmd/serve/...
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev

  build:all:
    desc: Build frontend and embed it into a self-contained server binary
    # Deliberately does NOT build the desktop shell: scripts/e2e-server.sh runs
    # this, and pulling in the CGO/wails build would make the Playwright suite
    # require Xcode CLT and blow its 180s server timeout. Use build:everything.
    cmds:
      - task: build:frontend
      - task: build

  build:everything:
    desc: Build the server binary and, on macOS, the desktop shell as well
    cmds:
      - task: build:all
      # macOS-only (platforms: [darwin]); Task skips it on other OSes, so this
      # task stays cross-platform.
      - task: build:desktop

  build:cli:
    desc: Build dashboard CLI binary
    dir: server
    cmd: go build -o ../bin/dashboard ./cmd/cli/...

  build:desktop:
    desc: Build the macOS desktop shell (embeds the SPA; requires macOS + Xcode CLT)
    platforms: [darwin]
    cmds:
      # The frontend must be embedded before the Go build, else the shell serves
      # an empty dist and the webview hits a redirect loop.
      - task: build:frontend
      # -tags production selects the real wails app (the untagged build errors at
      # runtime); the extldflags links UniformTypeIdentifiers, which wails needs
      # on the macOS 15 SDK but a plain `go build` omits.
      # The version is stamped here too: a desktop window that cannot name its
      # own build is indistinguishable from a stale one (see /api/system/health).
      - cd desktop && CGO_ENABLED=1 go build -tags production -ldflags "-X github.com/lx-wnk/agent-dashboard/server/internal/version.Version={{.VERSION}} -extldflags '-framework UniformTypeIdentifiers'" -o ../bin/agent-dashboard-desktop .
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev

  desktop:run:
    desc: Build and launch the macOS desktop shell for a smoke test
    platforms: [darwin]
    cmds:
      - task: build:desktop
      - ./bin/agent-dashboard-desktop

  desktop:dist:
    desc: Package the macOS desktop shell into an unsigned bin/Agent Dashboard.app bundle (requires the wails CLI + Xcode CLT)
    platforms: [darwin]
    cmds:
      - defer: git checkout -- desktop/wails.json
      - task: build:frontend
      # wails has no CLI flag for productVersion — it only reads desktop/wails.json —
      # so stamp the real git version in before the build and restore it via defer:
      # above (runs even on failure), keeping the working tree clean.
      - |
        VERSION="$(git describe --tags --always --dirty)"; sed -i '' "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"${VERSION}\"/" desktop/wails.json
      # Same production tag + UniformTypeIdentifiers ldflag as build:desktop, driven
      # through `wails build` so it also renders desktop/wails.json + Info.plist into
      # a real .app bundle instead of a bare Mach-O binary.
      - cd desktop && $(go env GOPATH)/bin/wails build -clean -tags production -ldflags "-X github.com/lx-wnk/agent-dashboard/server/internal/version.Version={{.VERSION}} -extldflags '-framework UniformTypeIdentifiers'"
      - mkdir -p bin
      - rm -rf "bin/Agent Dashboard.app"
      - cp -R "desktop/build/bin/Agent Dashboard.app" bin/
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev

  desktop:dmg:
    desc: Package bin/Agent Dashboard.app into an unsigned bin/Agent Dashboard.dmg (via hdiutil, no external tool needed)
    platforms: [darwin]
    cmds:
      - task: desktop:dist
      - rm -f "bin/Agent Dashboard.dmg"
      - hdiutil create -volname "Agent Dashboard" -srcfolder "bin/Agent Dashboard.app" -ov -format UDZO "bin/Agent Dashboard.dmg"

  test:
    desc: Run all tests (all modules)
    cmds:
      - cd sdk && go test -race ./...
      - cd server && go test -race ./...

  test:cover:
    desc: Run tests with coverage report (server module)
    dir: server
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  test:watch:
    desc: Watch mode tests (server module)
    dir: server
    cmd: go test -race ./... -count=1

  lint:
    desc: Run golangci-lint (all modules)
    cmds:
      - cd sdk && golangci-lint run ./...
      - cd server && golangci-lint run ./...

  generate:
    desc: Run go generate (ent schemas) and tygo TS codegen
    cmds:
      - $(go env GOPATH)/bin/tygo generate --config tygo.yaml
      - cd server && go generate ./...

  vuln:
    desc: Run govulncheck
    cmds:
      - cd sdk && govulncheck ./...
      - cd server && govulncheck ./...

  licenses:
    desc: Generate THIRD_PARTY_LICENSES.md from Go and frontend dependencies
    cmd: ./scripts/gen-licenses.sh

  audit:frontend:
    desc: Run pnpm audit on frontend dependencies (fails on high or critical vulnerabilities)
    cmd: pnpm audit --audit-level=high

  # wire task removed — DI is hand-written in server/cmd/serve/di.go (no google/wire codegen)

  fmt:
    desc: Format all Go code
    cmd: gofmt -w sdk/ server/
